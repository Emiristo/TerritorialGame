name: Tests

on:
  push:
    branches: [main, scaffold]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run game tests
        run: npm test
      - name: Build browser game
        run: npm run build
